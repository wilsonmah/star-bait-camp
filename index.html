<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2b2233;--paper:#fbf3df;--paper2:#f3e6c8;--amber:#ffcf6b;--night:#0b1026;--glass:rgba(16,14,36,.62);--line:rgba(255,233,168,.22)}
html,body{height:100%;background:var(--night);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
#sceneWrap{position:relative;flex:none;width:100%;overflow:hidden}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:none}
#below{flex:1;background:linear-gradient(#141a36,#0b1026);display:flex;align-items:flex-start;justify-content:center;padding:14px 18px;color:#b8bfe8;font-size:13px;line-height:1.75;text-align:center;overflow:auto}
body.strip #below{display:none}
.hudL{position:absolute;left:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.campchip{pointer-events:auto;cursor:pointer;min-width:122px;max-width:190px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:6px 10px 7px;color:#ffe9a8;font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.campchip .nm{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden}
.campchip .nm span{overflow:hidden;text-overflow:ellipsis}
.campchip .nm b{color:#fff;font-weight:800}
.campchip .xp{height:4px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:5px;overflow:hidden}
.campchip .xp i{display:block;height:100%;background:linear-gradient(90deg,#ffcf6b,#ff9a5a);border-radius:3px}
.beta{background:linear-gradient(135deg,#ff6a8a,#ff4a6a);color:#fff;font-weight:900;font-size:10px;letter-spacing:.8px;padding:2px 8px;border-radius:999px;box-shadow:0 2px 8px rgba(255,74,106,.4);pointer-events:none}
.hud{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 10px);display:flex;gap:6px;z-index:5;pointer-events:none;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.chip{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);color:#ffe9a8;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#focusChip{display:none;background:rgba(255,207,107,.94);color:#3a2a1c;border-color:transparent}
.bar{position:relative;flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:linear-gradient(180deg,rgba(22,20,46,.94),rgba(10,10,28,.98));-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tb{appearance:none;border:0;background:transparent;color:#aeb6e0;font:inherit;font-size:11px;font-weight:700;padding:6px 2px 5px;border-radius:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,color .15s,transform .1s}
.tb i{font-style:normal;font-size:22px;line-height:1.1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.tb:active{transform:scale(.94);background:rgba(255,255,255,.08)}
.tb.on{color:#ffe9a8;background:linear-gradient(180deg,rgba(255,207,107,.22),rgba(255,207,107,.08));box-shadow:inset 0 0 0 1px rgba(255,207,107,.35)}
@media (min-width:700px){.bar{max-width:640px;margin:0 auto;width:100%;border-radius:20px 20px 0 0}.tb{flex-direction:row;justify-content:center;gap:6px;font-size:13px;padding:10px 4px}.tb i{font-size:18px}}
body.strip .tb span{display:none}
/* panels */
#panel{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,8,22,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:14px}

.card{width:min(460px,100%);max-height:min(660px,88vh);overflow:auto;background:linear-gradient(180deg,#fdf6e4,#f6ead0);border:1px solid rgba(60,40,70,.18);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.7);padding:18px 18px 16px;overscroll-behavior:contain;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(18px);opacity:.3}}
.card h2{font-size:18px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.card h2 button{appearance:none;border:0;background:rgba(43,34,51,.08);color:var(--ink);font-weight:900;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:14px}
.sub{font-size:12.5px;color:#6b5a6e;margin-bottom:12px;line-height:1.65}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(120,90,60,.14);font-size:14px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:#7a6a7d;font-size:11.5px;line-height:1.45;margin-top:1px}
.btn{appearance:none;border:0;background:linear-gradient(180deg,#ffd98a,#ffc24d);color:#3a2a1c;font:inherit;font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(150,90,10,.35),0 4px 10px rgba(150,90,10,.18);cursor:pointer;white-space:nowrap;transition:transform .1s,filter .15s}

.btn.big{font-size:15px;padding:12px 22px}
.btn.alt{background:#fff;border:1px solid rgba(60,40,70,.18);box-shadow:0 2px 6px rgba(0,0,0,.08)}
img.fish{width:48px;height:28px;image-rendering:pixelated;flex:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}

.cell img{width:56px;height:32px;image-rendering:pixelated}
.cell.unk{color:#b9a98c}
.dots{letter-spacing:2px;font-size:14px;color:#c9b27a}
.dots b{color:#ffb200}
textarea{width:100%;height:80px;border:1px solid rgba(60,40,70,.25);border-radius:14px;background:#fff;padding:10px;font:inherit;font-size:16px;resize:none;margin:8px 0;outline:none}
input[type=range]{width:100%;accent-color:#ff9a3c;height:30px}
select{font:inherit;border:1px solid rgba(60,40,70,.25);border-radius:10px;padding:6px;background:#fff;font-size:14px}
.center{text-align:center}
.msg{font-size:15px;line-height:1.8;padding:12px 4px;text-align:center}
.ftxt{position:absolute;z-index:7;transform:translate(-50%,-100%);font-weight:900;font-size:13px;color:#ffe9a8;text-shadow:0 2px 0 #2b2233,2px 0 0 #2b2233,-2px 0 0 #2b2233,0 -2px 0 #2b2233;white-space:nowrap;pointer-events:none;animation:ftxt 1.4s ease-out forwards}

#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;background:rgba(18,16,40,.9);color:#fff4d8;border:1px solid var(--line);border-radius:16px;padding:9px 14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;max-width:92%;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.35);transition:opacity .3s,transform .3s;pointer-events:none}

#toast img{width:56px;height:32px;image-rendering:pixelated}
#toast small{display:block;font-weight:500;color:#b8b0d8;font-size:11.5px;margin-top:1px}
body.editing #toast{bottom:70px}
/* reel */
#reel{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding-bottom:20vh;background:rgba(0,0,0,.2);cursor:pointer}

#reelBox{background:rgba(18,16,40,.92);color:#fff4d8;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:14px 16px;width:min(340px,92vw);text-align:center;font-weight:800;font-size:14px}

#reelMark{position:absolute;top:-4px;bottom:-4px;width:5px;background:#fff;border-radius:3px;margin-left:-2px;box-shadow:0 0 8px rgba(255,255,255,.8)}
.note{font-size:11.5px;color:#b8b0d8;margin-top:8px;font-weight:500}
a{color:#ffcf6b}
#bHelp{display:none}
/* camp / quests UI */
.tabs{display:flex;gap:6px;background:rgba(43,34,51,.07);padding:4px;border-radius:14px;margin:12px 0 8px}
.tab{flex:1;appearance:none;border:0;background:transparent;font:inherit;font-weight:800;font-size:13px;padding:8px 4px;border-radius:11px;color:#7a6a7d;cursor:pointer}
.tab.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.meter{height:8px;background:rgba(43,34,51,.12);border-radius:5px;overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffcf6b,#ff9a5a);border-radius:5px;transition:width .3s}
.campcard{background:rgba(255,255,255,.55);border:1px solid rgba(120,90,60,.15);border-radius:16px;padding:10px 12px;margin-top:8px}
.campcard input{width:100%;border:0;background:transparent;font:inherit;font-size:17px;font-weight:800;color:var(--ink);outline:none;border-bottom:1px dashed rgba(60,40,70,.25);padding:2px 0 4px}
.xpline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.beauty{margin-top:6px;font-size:12px;color:#6b5a6e}
.seclab{font-size:12px;font-weight:800;color:#8a6a4a;margin-top:12px;letter-spacing:.3px}
.swgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.sw{width:40px;height:40px;border-radius:12px;border:2px solid transparent;background:linear-gradient(135deg,var(--c) 55%,var(--c2) 55%);cursor:pointer;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.18)}

.sw.lock{filter:grayscale(.85) brightness(.85);opacity:.7}

.itemimg{width:46px;height:38px;object-fit:contain;image-rendering:pixelated;background:rgba(43,34,51,.06);border-radius:10px;padding:3px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tile{appearance:none;border:0;background:#fff;border-radius:16px;padding:14px 4px;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.tile:active{transform:scale(.96)}
.tile i{font-style:normal;font-size:26px}
.lockt{font-size:11px;color:#b0583a;font-weight:700}
.badge{display:inline-block;background:#ffe9a8;color:#7a5a10;border-radius:8px;padding:1px 7px;font-size:11px;font-weight:800}
.qmeter{display:flex;align-items:center;gap:8px;margin-top:5px}
.qmeter small{margin:0;white-space:nowrap}
#editBar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;z-index:8;display:flex;align-items:center;gap:8px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;color:#ffe9a8;font-size:12.5px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:nowrap}
#editBar.hide{display:none}
#editBar .btn{padding:7px 12px}
@media (max-width:640px){
  .bar{padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
  .chip{font-size:11px;padding:3px 8px}
  .hud{gap:4px}
  #panel{align-items:flex-end;padding:0}
  .card{width:100%;max-height:84vh;border-radius:24px 24px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .card::before{content:'';display:block;width:42px;height:5px;border-radius:3px;background:rgba(60,40,70,.2);margin:0 auto 10px}
  .btn{min-height:40px}
  .btn.big{min-height:48px}
  #reel{padding-bottom:26vh}
}
@media (orientation:landscape) and (max-height:500px){
  .bar{padding:4px 8px calc(env(safe-area-inset-bottom) + 4px)}
  .tb{flex-direction:row;justify-content:center;gap:5px;padding:6px 4px;font-size:11px}
  .tb i{font-size:16px}
  #panel{align-items:center;padding:8px}
  .card{max-height:92vh;border-radius:18px}
  .card::before{display:none}
}
</style>
</head>

<script>
/*!

(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const H = 135;
let W = 240, S = 3;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ============================================================ save
const SAVE_KEY = 'sbc_save_v1';
const DEF = { warmth: 0, dust: 0, fish: {}, dishes: 0, book: {}, lit: {}, done: [], up: { rod: 0, bait: 0, auto: 0 }, decor: [], gifts: 0, lastSeen: Date.now(), vol: { fire: .6, rain: 0, wave: .4, bug: .5, music: .35 }, autoOn: true, timeMode: 'real', meteorPreview: false, strip: false, summon: null, catches: 0, lang: null, grill: [], camp: null, xp: 0, quest: null, ach: {}, rec: {}, stats: {} };
let G;
try { G = Object.assign({}, DEF, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { G = Object.assign({}, DEF); }
G.vol = Object.assign({}, DEF.vol, G.vol); G.up = Object.assign({}, DEF.up, G.up);
if (!Array.isArray(G.grill)) G.grill = [];
G.camp = Object.assign({ name: '', placed: [], inv: {}, cos: {}, cd: {} }, G.camp || {});
G.stats = Object.assign({ cooked: 0, perfect: 0, focusMin: 0, lit: 0 }, G.stats || {});
G.rec = G.rec || {}; G.ach = G.ach || {}; G.xp = G.xp || 0;
if (!G.lang) G.lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
const T = (zh, en) => G.lang === 'en' ? en : zh;
function save() { G.lastSeen = Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
setInterval(save, 5000);

// ============================================================ time & sky
function hourNow() {
  if (G.timeMode === 'day') return 12; if (G.timeMode === 'dusk') return 18.6; if (G.timeMode === 'night') return 22.5;
  const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function phaseOf(h) { return (h >= 20 || h < 5) ? 'night' : h < 7 ? 'dawn' : h < 17 ? 'day' : 'dusk'; }
const PHASE_CN = { night: '夜晚', dawn: '清晨', day: '白天', dusk: '黄昏' };
const PHASE_EN = { night: 'night', dawn: 'dawn', day: 'daytime', dusk: 'dusk' };
const phaseName = p => T(PHASE_CN[p], PHASE_EN[p]);
function nightFactor(h) {
  if (h >= 21 || h < 4.5) return 1;
  if (h >= 4.5 && h < 7) return 1 - (h - 4.5) / 2.5;
  if (h >= 17.5 && h < 21) return (h - 17.5) / 3.5;
  return 0;
}
const SKY = [[0, '#070b1e', '#151b3c'], [4.5, '#0d1236', '#262b58'], [6, '#3a4a8a', '#f2a26a'], [7.5, '#5a9fe0', '#c3e4ff'], [12, '#4a9ae8', '#c3e7ff'], [16.5, '#5a9ade', '#d2e8f8'], [18, '#3c4f9a', '#f7a06a'], [19.5, '#1f2152', '#6a3f6e'], [21, '#0a0f28', '#1a1f46'], [24, '#070b1e', '#151b3c']];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; };
function skyCols(h) { for (let i = 0; i < SKY.length - 1; i++) { const a = SKY[i], b = SKY[i + 1]; if (h >= a[0] && h <= b[0]) { const t = (h - a[0]) / (b[0] - a[0]); return [mix(a[1], b[1], t), mix(a[2], b[2], t)]; } } return [SKY[0][1], SKY[0][2]]; }

// ============================================================ update
let last = performance.now();
function update(dt) {
  tm += dt;
  const h = hourNow(), nf = nightFactor(h);
  // particles
  for (const p of fx.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (!p.fire && !p.smoke) p.vy += 30 * dt; }
  fx.parts = fx.parts.filter(p => p.life > 0);
  for (const r of fx.ripples) r.r += dt * 8; fx.ripples = fx.ripples.filter(r => r.r < 10);
  for (const hh of fx.hearts) { hh.y -= dt * 10; hh.life -= dt; } fx.hearts = fx.hearts.filter(h => h.life > 0);
  flash = Math.max(0, flash - dt * 1.5);
  if (G.summon) summonGlow = Math.min(1, summonGlow + dt);
  // shooting stars
  const met = meteorToday();
  if (nf > .6 && Math.random() < dt * (met ? .5 : .02)) fx.shoots.push({ x: rand(W * .2, W), y: rand(4 - PAD * .8, 30), vx: rand(-90, -60), vy: rand(30, 45), a: 1, life: 1.1 });
  for (const s of fx.shoots) { s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; s.a = Math.min(1, s.life); }
  fx.shoots = fx.shoots.filter(s => s.life > 0);
  // fishing
  fishing.t += dt;
  if (fishing.st === 'wait' && fishing.t > fishing.wait) onBite();
  else if (fishing.st === 'bite') { fishing.biteT += dt; if (fishing.biteT > biteWindow(fishing.bite) && !reel.on) autoResolve(); }
  else if (fishing.st === 'gone' && fishing.t > (G.autoOn ? 1.6 : 1.2)) castLine();
  // visitor
  visitorT -= dt;
  if (!visitor && visitorT < 0) { visitor = { x: -12, tx: Math.max(4, scen.tentX + 20), wait: false, t: 0 }; }
  if (visitor) {
    if (!visitor.wait && !visitor.leaving) { visitor.x += 14 * dt; if (visitor.x >= visitor.tx) { visitor.wait = true; visitor.t = 0; } }
    else if (visitor.wait) { visitor.t += dt; if (visitor.t > 60) { visitor.wait = false; visitor.leaving = true; } }
    if (visitor.leaving) { visitor.x -= 16 * dt; if (visitor.x < -14) { visitor = null; visitorT = rand(150, 300) / (1 + beauty() / 60); } }

  // focus
  if (focus.on) { const left = Math.max(0, focus.end - Date.now()); $('#focusChip').textContent = '⏳ ' + String(Math.floor(left / 60000)).padStart(2, '0') + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0'); if (left <= 0) endFocus(true); }
  // burn effect
  if (fx.burn) { fx.burn.t += dt; if (fx.burn.t < 1.6) for (let i = 0; i < 4; i++) fx.parts.push({ x: scen.fireX + rand(-4, 4), y: 104, vx: rand(-10, 10), vy: rand(-40, -20), life: rand(.5, 1.1), fire: true, burnCol: pick(['#b0a0ff', '#ffb0e0', '#a0e0ff', '#fff3b0']) }); else fx.burn = null; }
  grillUpdate(dt);
  sound.update(nf);
}
function frame(now) { const dt = Math.min(.1, (now - last) / 1000); last = now; update(dt); draw(dt); requestAnimationFrame(frame); }

  if (f.moon) return f.moon === 'full' ? T('满月夜', 'Full-moon nights') : T('新月夜', 'New-moon nights');
  if (f.rain) return T('下雨的时候', 'When it rains');
  if (f.season) return T({ spring: '春天', summer: '夏天', autumn: '秋天', winter: '冬天' }[f.season] + '限定', { spring: 'Spring', summer: 'Summer', autumn: 'Autumn', winter: 'Winter' }[f.season] + ' only');

const sound = {
  ac: null, nodes: {},
  start() {

    const ac = this.ac = new AC();

    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    this.nodes.rain = loop([['highpass', 900], ['lowpass', 7000]], 0);
    this.nodes.wave = loop([['lowpass', 380]], 0);
    // lofi jazz bus: everything -> warm lowpass -> master
    this.music = ac.createGain(); this.music.gain.value = 0;
    const warm = ac.createBiquadFilter(); warm.type = 'lowpass'; warm.frequency.value = 2200; warm.Q.value = .5;
    this.music.connect(warm); warm.connect(this.master);
    const dl = ac.createDelay(1); dl.delayTime.value = .42; const fb = ac.createGain(); fb.gain.value = .22; const dlOut = ac.createGain(); dlOut.gain.value = .45;
    dl.connect(fb); fb.connect(dl); dl.connect(dlOut); dlOut.connect(this.music); this.delay = dl;

    this.trem = ac.createGain(); this.trem.gain.value = .8;
    const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = 4.2; lfoG.gain.value = .18; lfo.connect(lfoG); lfoG.connect(this.trem.gain); lfo.start();

    { r: 43, v: [53, 59, 64, 69], mel: [62, 67, 71, 74] },       // G13

    { r: 45, v: [55, 59, 60, 64], mel: [64, 67, 69, 72] },       // Am9
    { r: 41, v: [57, 60, 64, 67], mel: [65, 69, 72, 76] },       // Fmaj9
    { r: 40, v: [56, 62, 65, 68], mel: [64, 68, 71, 74] },       // E7b9
    { r: 45, v: [55, 59, 60, 64], mel: [64, 67, 69, 72] },       // Am9

  showCard(h);
  card.querySelectorAll('[data-qt]').forEach(b => b.onclick = () => openQuest(b.dataset.qt));
  card.querySelectorAll('[data-claim]').forEach(b => b.onclick = () => claimQuest(+b.dataset.claim));
}
function openMore() {
  const tiles = [['book', '📖', T('钓鱼手帐', 'Journal')], ['focus', '⏳', T('专注时光', 'Focus')], ['worry', '📝', T('烧烦恼', 'Burn Worries')], ['sound', '🎧', T('声音', 'Sound')], ['quest', '📜', T('委托与成就', 'Quests')], ['set', '⚙', T('设置', 'Settings')], ['help', '❔', T('玩法', 'How to')], ['strip', '▭', T('条状模式', 'Strip Mode')], ['lang', '🌐', T('语言', 'Language')]];
  showCard(head(T('☰ 更多', '☰ More'), '') + `<div class="tiles">${tiles.map(([k, i, n]) => `<button class="tile" data-go="${k}"><i>${i}</i>${n}</button>`).join('')}</div>`);
  card.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const k = b.dataset.go; if (k === 'strip') { closePanel(); $('#bStrip').click(); } else if (k === 'lang') { $('#bLang').click(); openMore(); } else openPanel(k); });
}

// ---------------- wrappers ----------------
const _land = land;
land = function (f, auto) {
  _land(f, auto);
  if (!f.junk) { qEvent('catch'); if (nightFactor(hourNow()) > .6) qEvent('night'); if (f.v >= 6) qEvent('rare'); }
  const base = f.junk ? 0 : 10 + f.v * 3, cm = base ? Math.round(base * (.65 + Math.random() * .75)) : 0;
  if (cm) { const old = G.rec[f.id] || 0; if (cm > old) G.rec[f.id] = cm; $('#tTitle').textContent += ` · ${cm}cm` + (cm > old && old ? ' ⭐' : ''); }
  gainXp(f.junk ? 1 : f.legend ? 40 : Math.ceil(f.v / 2) + 1);
};
const _grillAct = grillAct;
grillAct = function (i, auto) {
  const s = G.grill[i], d0 = G.dishes, k = s ? s.t / SIDE : 0, perfectNow = !auto && k >= GOLD0 && k <= GOLD1, pA = s && s.pA;
  _grillAct(i, auto);
  if (G.dishes > d0) { G.stats.cooked++; qEvent('cook'); gainXp(3); if (pA && perfectNow) { G.stats.perfect++; qEvent('perfect'); gainXp(4); } }
};
const _giftVisitor = giftVisitor;
giftVisitor = function () { const g0 = G.gifts; _giftVisitor(); if (G.gifts > g0) { qEvent('gift'); gainXp(8); syncDecor(); } };
const _endFocus = endFocus;
endFocus = function (done) { _endFocus(done); if (done) { qEvent('focus'); G.stats.focusMin += focus.len; G.warmth += Math.round(focus.len * .2 * Math.min(2, perk('bench'))); gainXp(focus.len * 1.2); hud(); } };
const _biteWait = biteWait;
biteWait = function () { return _biteWait() * (Date.now() < buff.guitar ? .8 : 1); };
const _autoResolve = autoResolve;
autoResolve = function () { const c = Math.min(3, perk('cooler')); G.up.auto += c; _autoResolve(); G.up.auto -= c; };

// ---------------- scene art ----------------
const rgbaC = (h, a) => { const c = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };
function drawFar(nf) {
  const m1 = mix('#6a78b0', '#1c2244', nf), m2 = mix('#52609e', '#171c3c', nf);
  ctx.fillStyle = m1; ctx.beginPath(); ctx.moveTo(0, 96);
  for (let x = 0; x <= W; x += 3) ctx.lineTo(x, 66 - Math.abs(Math.sin(x * .021 + .7)) * 20 - Math.sin(x * .09) * 2);
  ctx.lineTo(W, 96); ctx.fill();
  ctx.fillStyle = m2; ctx.beginPath(); ctx.moveTo(0, 96);
  for (let x = 0; x <= W; x += 3) ctx.lineTo(x, 76 - Math.abs(Math.sin(x * .03 + 2.2)) * 13 - Math.sin(x * .11) * 2);
  ctx.lineTo(W, 96); ctx.fill();
  if (nf < .75) { // drifting clouds
    for (let k = 0; k < 6; k++) {
      const x = ((k * 53 + tm * (1.5 + k * .45)) % (W + 70)) - 35, y = 10 + (k % 3) * 15 - Math.floor(k / 3) * PAD * .55, w = 16 + (k % 3) * 6, a = (1 - nf) * .55, c = `rgba(255,${240 - nf * 60},${225 - nf * 70},${a})`;
      ctx.fillStyle = c; ctx.fillRect(x, y, w, 3); ctx.fillRect(x + 3, y - 2, w - 7, 3); ctx.fillRect(x + w * .35, y - 4, w * .3, 2);
    }
  }
  if (nf > .7 && season() === 'winter') { // aurora
    for (let b = 0; b < 3; b++) for (let x = 0; x < W; x += 2) { const y = 28 - PAD * .35 + Math.sin(x * .045 + tm * .5 + b * 2) * 8 + b * 7; ctx.fillStyle = b === 1 ? `rgba(160,120,255,${.05 * nf})` : `rgba(100,255,190,${.06 * nf})`; ctx.fillRect(x, y, 2, 15); }
  }
}
function drawGroundDetail(nf) {
  const sc = scen, gp = cosv('ground');
  if (!sc.tufts || sc.tuftsFor !== sc.lakeX) { const R = seeded(33); sc.tufts = Array.from({ length: Math.round(sc.lakeX / 2.6) }, () => ({ x: R() * (sc.lakeX - 4), y: 93 + R() * 31, k: R(), f: R() })); sc.tuftsFor = sc.lakeX; }
  const t1 = mix(gp.b, '#1a2a24', nf * .85), t2 = mix(gp.a, '#223630', nf * .8);
  for (const t of sc.tufts) { px(t.x, t.y, 1, 2, t.k < .5 ? t1 : t2); if (t.f > .86) px(t.x + 1, t.y - 1, 1, 1, mix(['#ff9ab8', '#ffe08a', '#c8a0ff', '#fff'][Math.floor(t.k * 4)], '#554466', nf * .6)); }
  // dirt path tent -> fire
  for (let x = sc.tentX + 10; x < sc.fireX - 5; x += 1) px(x, 110 + Math.round(Math.sin(x * .3)), 1, 2, mix('#c0a070', '#3a3226', nf * .8));
  // fire ring stones
  for (let i = 0; i < 9; i++) { const a = i / 9 * 6.28; px(sc.fireX + Math.cos(a) * 8, 107 + Math.sin(a) * 2.4, 2, 1, mix(i % 2 ? '#9aa0a8' : '#7a808a', '#2a2e38', nf * .7)); }
  // water: sparkle + lily pads
  const wl = sc.lakeX + 6;
  for (let i = 0; i < 16; i++) { const x = wl + ((i * 37 + Math.floor(tm * 2 + i)) % Math.max(10, W - wl - 4)), y = 100 + (i * 13) % 24; if (Math.sin(tm * 2.2 + i * 1.7) > .65) px(x, y, 2, 1, `rgba(255,255,255,${.5 * (1 - nf * .55)})`); }
  for (let i = 0; i < 4; i++) { const x = wl + 12 + i * 29 % Math.max(14, W - wl - 18), y = 110 + (i * 7) % 12; px(x, y, 4, 2, mix('#4a9a5a', '#14301f', nf * .8)); px(x + 1, y - 1, 2, 1, mix('#5ab06a', '#18382a', nf * .8)); }
}
function drawTentDetail(tx, ty, nf) {
  const t = cosv('tent');
  px(tx + 13, ty - 20, 1, 6, '#6a4a30'); px(tx + 14, ty - 20, 4, 2, mix(t.b, '#2a1e30', nf * .6)); px(tx + 14, ty - 18, 3, 1, mix(t.b, '#2a1e30', nf * .6));
  px(tx + 10, ty + 1, 1, 3, '#2b2233'); px(tx + 16, ty + 1, 1, 3, '#2b2233'); px(tx - 3, ty + 3, 2, 1, '#6a4a30'); px(tx + 27, ty + 3, 2, 1, '#6a4a30');
  for (let i = 0; i < 3; i++) px(tx + 4 + i * 9, ty - 2 - i * 0, 1, 1, rgbaC('#ffffff', .22));
}
function drawFinish(nf) {
  if (nf > .35) {
    ctx.globalCompositeOperation = 'lighter';
    const n = season() === 'summer' ? 14 : 9;
    for (let i = 0; i < n; i++) {
      const bx = (i * 47) % Math.max(60, scen.lakeX), x = bx + Math.sin(tm * .35 + i * 2.1) * 12, y = 96 + ((i * 29) % 26) + Math.cos(tm * .4 + i * 1.3) * 5, a = Math.max(0, Math.sin(tm * 1.7 + i * 3.1)) * nf;
      if (a < .05) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, 4); g.addColorStop(0, `rgba(230,255,140,${a * .8})`); g.addColorStop(1, 'rgba(230,255,140,0)'); ctx.fillStyle = g; ctx.fillRect(x - 4, y - 4, 8, 8); px(x, y, 1, 1, `rgba(255,255,220,${a})`);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  const vg = ctx.createRadialGradient(W / 2, 62, Math.min(W, H) * .35, W / 2, 62, Math.max(W, H + PAD) * .85);
  vg.addColorStop(0, 'rgba(6,8,24,0)'); vg.addColorStop(1, `rgba(6,8,24,${.2 + nf * .3})`);
  ctx.fillStyle = vg; ctx.fillRect(0, -PAD, W, H + PAD);
}

// ============================================================ boot
applyLang(); castLine(); hud();
// offline progress
(() => {
  const away = Math.min(8 * 3600, (Date.now() - (G.lastSeen || Date.now())) / 1000);
  if (G.autoOn && away > 120 && G.catches > 0) {
    const n = Math.min(40, Math.floor(away / 90 * (.4 + G.up.auto * .06)));
    if (n > 0) {
      const got = {};
      for (let i = 0; i < n; i++) { const f = FISH.filter(f => !f.legend && !f.junk && f.t === 'any' && !f.season && !f.rain)[Math.floor(Math.random() * 2)]; G.fish[f.id] = (G.fish[f.id] || 0) + 1; got[fname(f)] = (got[fname(f)] || 0) + 1; }
      save();
      setTimeout(() => openPanel('welcome', T(`你离开了 ${Math.round(away / 60)} 分钟。<br>小营地替你钓到了：<br><b>${Object.entries(got).map(([k, v]) => k + ' ×' + v).join('、')}</b><br>营火一直帮你留着。`, `You were away for ${Math.round(away / 60)} minutes.<br>The little camp caught these for you:<br><b>${Object.entries(got).map(([k, v]) => k + ' ×' + v).join(', ')}</b><br>The campfire kept burning while you were gone.`)), 600);
    }
  } else if (!G.catches) setTimeout(() => showToast(null, T('⛺ 欢迎来到钓星营地（Beta）', '⛺ Welcome to Star Bait Camp (Beta)'), T('挂机会自动钓鱼；看到浮漂上的「!」就点它亲手收竿', 'The camp fishes on its own; when you see “!” on the bobber, tap it to reel in yourself'), 5200), 800);
})();
requestAnimationFrame(frame);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); if (sound.ac) sound.ac.suspend(); } else if (sound.ac) sound.ac.resume(); });
})();
